name: build-windows

# 云端编译 Windows 版 vidbar_send / vidbar_recv（无需本地安装任何编译环境）
# 触发：手动（Actions 页 → Run workflow）或推送到 native/、build_native.py 时自动

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - native/**
      - build_native.py
      - triplets/**
      - .github/workflows/build-windows.yml

jobs:
  build:
    runs-on: windows-latest      # 微软服务器自带 VS2022 / git / cmake / python
    timeout-minutes: 240         # 首次构建 opencv+angle 约 1~2 小时，缓存命中后约 10 分钟
    env:
      PYTHONIOENCODING: utf-8    # Windows runner 默认 cp1252，中文输出会崩

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # vcpkg 二进制缓存：让第二次起构建不必重编依赖。
      # v2-release：改用 x64-windows-release triplet（只编 release，跳过
      # ANGLE/opencv4 各约 1 小时的 debug 编译）。triplet 变更后 ABI 哈希
      # 不同，旧缓存无法复用，必须换键。首次构建约 60~90 分钟，缓存命中后
      # 约 10 分钟。
      - name: vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vidtx-vcpkg-binaries-v2-release

      - name: Build vidbar_send / vidbar_recv
        env:
          VCPKG_ROOT: ''          # 使用脚本自带 vcpkg，避开 runner 预装实例的状态差异
        run: python build_native.py

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: vidtx-win64-bin
          path: bin/
          if-no-files-found: error
